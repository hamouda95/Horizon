name: Vérifications des fondations

on:
  pull_request:
  push:
    branches:
      - foundation/0-1-cleanup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: render-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test --experimental-strip-types *.test.ts
      - run: npm run build
