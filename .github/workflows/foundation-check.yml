name: Préparation CI
on:
  push:
    branches: [foundation/0-2-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rm package-lock.json && npm install
      - name: Exporter le verrou généré
        run: echo "LOCKFILE_START$(base64 -w 0 package-lock.json)LOCKFILE_END"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
